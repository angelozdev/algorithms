[project]
name = "algorithms"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
